name: Build definitions

# Downloads ClamAV's official signature database with freshclam, extracts the
# file-hash signatures, and publishes one compact file to the "definitions"
# release. The app downloads that file.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  definitions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true

      - name: Fetch ClamAV database
        run: sudo freshclam

      - name: Build compact definitions
        env:
          MB_AUTH_KEY: ${{ secrets.MB_AUTH_KEY }}
        run: python3 scripts/build_definitions.py out/definitions.txt.gz

      - name: Publish to "definitions" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view definitions >/dev/null 2>&1 || \
            gh release create definitions --title "Virus definitions" \
              --notes "Auto-generated by the Build definitions workflow." --latest=false
          gh release upload definitions out/definitions.txt.gz --clobber
